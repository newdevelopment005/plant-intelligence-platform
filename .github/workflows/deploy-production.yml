name: Production Deployment

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Deploy all services"
        required: false
        type: boolean
        default: false
      deploy_frontend:
        description: "Deploy frontend to Vercel"
        required: false
        type: boolean
        default: false
      deploy_ai:
        description: "Deploy AI service to Hugging Face"
        required: false
        type: boolean
        default: false
      deploy_backend:
        description: "Deploy backend via Docker"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}-api
  AI_IMAGE_NAME: ${{ github.repository }}-ai-service

jobs:
  # =============================================
  # Build & Test
  # =============================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -e "apps/api[dev]"
        working-directory: apps/api

      - name: Run API tests
        run: pytest tests/ -v --tb=short
        working-directory: apps/api

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build web
        run: npm run build
        working-directory: apps/web

  # =============================================
  # Deploy Frontend to Vercel
  # =============================================
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: build-test
    if: >
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.deploy_all == 'true' ||
      github.event.inputs.deploy_frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
          NEXT_PUBLIC_AI_URL: ${{ secrets.AI_SERVICE_URL }}

  # =============================================
  # Deploy AI Service to Hugging Face Spaces
  # =============================================
  deploy-ai-service:
    name: Deploy AI Service (HF Spaces)
    runs-on: ubuntu-latest
    needs: build-test
    if: >
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.deploy_all == 'true' ||
      github.event.inputs.deploy_ai == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Hugging Face Hub
        uses: huggingface/login@v1
        with:
          token: ${{ secrets.HF_TOKEN }}

      - name: Upload files to HF Spaces
        uses: huggingface/hf_hub_upload@main
        with:
          repo_id: ${{ secrets.HF_USERNAME }}/pip-ai-service
          path: apps/ai-service/
          commit_message: "Deploy v${{ github.ref_name }}"

  # =============================================
  # Deploy Backend (Docker)
  # =============================================
  deploy-backend:
    name: Deploy Backend (Docker)
    runs-on: ubuntu-latest
    needs: build-test
    if: >
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.deploy_all == 'true' ||
      github.event.inputs.deploy_backend == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract metadata for AI Service
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AI_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push AI Service image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-service
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}

  # =============================================
  # Post-Deployment Verification
  # =============================================
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Wait for services to stabilize
        run: sleep 30

      - name: Check frontend health
        run: |
          if [ -n "${{ secrets.VERCEL_URL }}" ]; then
            curl -sf "${{ secrets.VERCEL_URL }}/api/health" || echo "Frontend health check pending"
          fi

      - name: Check backend health
        run: |
          if [ -n "${{ secrets.API_URL }}" ]; then
            curl -sf "${{ secrets.API_URL }}/health" || echo "Backend health check pending"
          fi

      - name: Check AI service health
        run: |
          if [ -n "${{ secrets.AI_SERVICE_URL }}" ]; then
            curl -sf "${{ secrets.AI_SERVICE_URL }}/health" || echo "AI service health check pending"
          fi
