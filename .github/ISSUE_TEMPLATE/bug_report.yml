name: Issue Template

description: Bug report for Plant Intelligence Platform
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the information below.

  - type: input
    id: module
    attributes:
      label: Module
      description: Which module is affected?
      options:
        - Authentication
        - Project Management
        - Germplasm
        - Phenotyping
        - Genomics
        - Molecular Biology
        - Literature
        - Knowledge Graph
        - AI Assistant
        - Notebook
        - LIMS
        - Image Analysis
        - Reporting
        - Admin
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots.
